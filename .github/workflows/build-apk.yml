name: AI Studio Cloud APK Builder

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Uygulama Adı'
        required: true
        default: 'AIStudioApp'
      app_id:
        description: 'Paket Adı (Bundle ID)'
        required: true
        default: 'com.aistudio.generatedapp'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Repo Kodunu Çek
        uses: actions/checkout@v4

      - name: Node.js ve Java 21 Kurulumu (Hızlı Önbellekli)
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Capacitor Android Sarmalayıcısını Hazırla
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "${{ github.event.inputs.app_name }}" "${{ github.event.inputs.app_id }}" --web-dir dist
          mkdir -p dist
          if [ ! -f dist/index.html ]; then
            cp index.html dist/index.html
          fi
          npx cap add android || npx cap sync android

      - name: APK Derle (Gradle AssembleDebug)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Doğrudan Telefona İndirilebilir APK Yayınla (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: "📱 ${{ github.event.inputs.app_name }} (Build #${{ github.run_number }})"
          files: android/app/build/outputs/apk/debug/app-debug.apk
